name: Python と道具を用意する
description: Python を用意し、requirements-dev.txt の道具を入れる
inputs:
  python-version:
    description: 使う Python のバージョン
    default: "3.13"
runs:
  using: composite
  steps:
    - name: Python を用意する
      uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: 道具を入れる
      shell: bash
      run: pip install -r requirements-dev.txt
