name: 下調べ8
on:
  pull_request:
permissions:
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: 変数を表示する
        run: echo "題名は ${{ vars.PAGE_TITLE }}"
      - name: シークレットを表示する
        run: echo "鍵は ${{ secrets.DUMMY_KEY }}"
  comment:
    runs-on: ubuntu-latest
    steps:
      - name: 件数をコメントする
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "テストは12件です"
  title:
    runs-on: ubuntu-latest
    steps:
      - name: 題名を表示する（直接）
        run: echo "題名は ${{ github.event.pull_request.title }}"
      - name: 題名を表示する（env）
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "題名は $TITLE"
