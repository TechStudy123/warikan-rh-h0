name: 毎朝の点検
on:
  schedule:
    - cron: "0 9 * * *"   # 毎朝9時（日本時間）
  workflow_dispatch:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - name: テストの件数をまとめに出す
        uses: actions/pytest-summary@v1
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: 3.10
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
