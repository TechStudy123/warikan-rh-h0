name: 毎朝の点検
on:
  schedule:
    - cron: "30 8 * * 1-5"   # 平日の朝8時30分（日本時間）
      timezone: "Asia/Tokyo"
  workflow_dispatch:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: pytest -v
      - name: テストの件数をまとめに出す
        uses: actions/pytest-summary@v1
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
