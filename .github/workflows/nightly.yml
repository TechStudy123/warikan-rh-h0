name: 毎朝の点検
on:
  schedule:
    - cron: "30 8 * * 1-5"   # 平日の朝8時30分（日本時間）
      timezone: "Asia/Tokyo"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
