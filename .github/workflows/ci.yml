name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    uses: ./.github/workflows/test.yml
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 道具を入れる
        run: pip install -r requirements-dev.txt
      - name: 書き方を検査する
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0
      - name: 書き方の崩れを検査する
        run: ruff format --check .
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 早見表を作る
        working-directory: scripts
        run: python build_site.py
      - name: 早見表を保存する
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
  report:
    needs: test
    runs-on: ubuntu-latest
    environment: practice
    permissions:
      pull-requests: write
    steps:
      - name: テストの結果を受け取る
        uses: actions/download-artifact@v8
        with:
          name: test-report
      - name: 受け取ったファイルを表示する
        run: ls -l
      - name: 件数をまとめに書く
        run: echo "テストの件数は ${{ needs.test.outputs.count }} 件" >> $GITHUB_STEP_SUMMARY
      - name: ページの題名を表示する
        run: echo "ページの題名は ${{ vars.PAGE_TITLE }}"
      - name: 件数をコメントする
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "テストは ${{ needs.test.outputs.count }} 件です"
      - name: プルリクエストの題名を表示する
        if: github.event_name == 'pull_request'
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: echo "題名は $TITLE"
