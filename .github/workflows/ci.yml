name: CI
on:
  push:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: ファイルの一覧を表示する
        run: ls
      - name: Python のバージョンを表示する
        run: python --version
      - name: 道具を入れる
        run: pip install -r requirements-dev.txt
      - name: テストを動かす
        run: pytest
