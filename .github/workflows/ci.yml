name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: ファイルの一覧を表示する
        run: ls
      - name: Python のバージョンを表示する
        run: python --version
      - name: 道具を入れる
        run: pip install -r requirements-dev.txt
      - name: テストを動かす
        run: pytest -v
      - name: わざと時間をかける
        run: sleep 180
      - name: テストの一覧をまとめに書く
        run: pytest --collect-only -q >> $GITHUB_STEP_SUMMARY
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 道具を入れる
        run: pip install -r requirements-dev.txt
      - name: 書き方を検査する
        run: ruff check .
      - name: 書き方の崩れを検査する
        run: ruff format --check .
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 早見表を作る
        working-directory: scripts
        run: python build_site.py
