name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.count.outputs.count }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: ファイルの一覧を表示する
        run: ls
      - name: Python のバージョンを表示する
        run: python --version
      - name: 道具を入れる
        run: pip install -r requirements-dev.txt
      - name: テストを動かす
        run: pytest -v --junitxml=report.xml
      - name: テストの件数を数える
        id: count
        run: echo "count=$(pytest --collect-only -q | grep -c '::')" >> $GITHUB_OUTPUT
      - name: テストの結果を保存する
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: report.xml
          retention-days: 7
      - name: テストの一覧をまとめに書く
        run: pytest --collect-only -q >> $GITHUB_STEP_SUMMARY
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 道具を入れる
        run: pip install -r requirements-dev.txt
      - name: 書き方を検査する
        run: ruff check .
      - name: 書き方の崩れを検査する
        run: ruff format --check .
  build:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取り出す
        uses: actions/checkout@v7
      - name: Python を用意する
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: 早見表を作る
        working-directory: scripts
        run: python build_site.py
      - name: 早見表を保存する
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: site
  report:
    needs: test
    runs-on: ubuntu-latest
    environment: practice
    steps:
      - name: テストの結果を受け取る
        uses: actions/download-artifact@v8
        with:
          name: test-report
      - name: 受け取ったファイルを表示する
        run: ls -l
      - name: 件数をまとめに書く
        run: echo "テストの件数は ${{ needs.test.outputs.count }} 件" >> $GITHUB_STEP_SUMMARY
      - name: ページの題名を表示する
        run: echo "ページの題名は ${{ vars.PAGE_TITLE }}"
      - name: 鍵を表示する（確かめたら消す）
        run: echo "鍵は ${{ secrets.DUMMY_KEY }}"
